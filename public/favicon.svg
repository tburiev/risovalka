<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4682B4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="5" y="5" width="90" height="90" rx="18" ry="18" fill="#1E293B"/>
  
  <!-- Back polygon (shadow/depth) -->
  <polygon 
    points="30,25 65,20 75,50 55,75 25,65" 
    fill="url(#grad)" 
    opacity="0.4"
    transform="translate(5, 5)"
  />
  
  <!-- Main polygon -->
  <polygon 
    points="30,25 65,20 75,50 55,75 25,65" 
    fill="url(#grad)" 
    stroke="white"
    stroke-width="2"
    stroke-linejoin="round"
  />
  
  <!-- Vertex dots -->
  <circle cx="30" cy="25" r="3" fill="white"/>
  <circle cx="65" cy="20" r="3" fill="white"/>
  <circle cx="75" cy="50" r="3" fill="white"/>
  <circle cx="55" cy="75" r="3" fill="white"/>
  <circle cx="25" cy="65" r="3" fill="white"/>
</svg>
